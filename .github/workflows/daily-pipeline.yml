name: Daily Tool Generation Pipeline

on:
  schedule:
    # 09:00 UTC every day
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      from_agent:
        description: 'Start from agent number (1=research, 2=planning, 3=development, 4=deploy, 5=social)'
        required: false
        default: '1'
        type: choice
        options: ['1', '2', '3', '4', '5']
      date_override:
        description: 'Override run date (YYYY-MM-DD, leave blank for today)'
        required: false
        default: ''

jobs:
  generate-tool:
    name: Generate and deploy daily tool
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      # GH_PAT is preferred (branch-protected main, PR creation, and pushes that
      # need to trigger downstream workflows), but it has to actually work.
      #
      # This used to read `token: ${{ secrets.GH_PAT != '' && secrets.GH_PAT ||
      # github.token }}`, with a comment claiming the explicit `!= ''` made an
      # expired PAT fall through to the auto-issued token. It does not, and the
      # comment had the mechanism backwards: `!= ''` is false only for the empty
      # string, which `||` already treats as falsy, so the two expressions are
      # byte-for-byte equivalent. A present-but-revoked PAT was still handed to
      # git either way. That is what failed every scheduled run from 2026-08-12
      # onward with `fatal: could not read Username for 'https://github.com'` —
      # four retries deep, before a single pipeline agent ran.
      #
      # No expression can test whether a token is still valid; only spending it
      # can. So we spend one cheap call on /user first and branch on the answer.
      - name: Probe GH_PAT
        id: pat
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GH_PAT is not set — using the auto-issued GITHUB_TOKEN."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user || echo 000)
          if [ "$code" = "200" ]; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GH_PAT is set but GitHub rejected it (HTTP $code) — it is expired or revoked. Falling back to GITHUB_TOKEN, which cannot open pull requests against branch-protected main. Rotate the secret to restore the full pipeline."
          fi

      - name: Checkout repository (GH_PAT)
        if: steps.pat.outputs.usable == 'true'
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout repository (GITHUB_TOKEN)
        if: steps.pat.outputs.usable != 'true'
        uses: actions/checkout@v5
        with:
          token: ${{ github.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Build extra args
        id: args
        run: |
          EXTRA=""
          FROM_AGENT="${{ github.event.inputs.from_agent }}"
          DATE_OVERRIDE="${{ github.event.inputs.date_override }}"
          if [ -n "$FROM_AGENT" ] && [ "$FROM_AGENT" != "1" ]; then
            EXTRA="$EXTRA --from-agent $FROM_AGENT"
          fi
          if [ -n "$DATE_OVERRIDE" ]; then
            EXTRA="$EXTRA --date $DATE_OVERRIDE"
          fi
          echo "extra=$EXTRA" >> "$GITHUB_OUTPUT"

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Blanked when the probe rejected it: deploy.py prefers GH_PAT
          # over GITHUB_TOKEN whenever it is non-empty, so passing a
          # revoked one through would move the same failure downstream.
          GH_PAT: ${{ steps.pat.outputs.usable == 'true' && secrets.GH_PAT || '' }}
          # Fallback for pipeline/agents/deploy.py::_configure_git when GH_PAT
          # is unset/empty. Workflow has `permissions: contents: write` so
          # this token can push to main; PR creation will still require GH_PAT.
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOY_TO_MAIN: ${{ vars.DEPLOY_TO_MAIN || 'false' }}
          # Social Media — Agent 5 (missing secrets are handled gracefully)
          SOCIAL_DRAFT_MODE: ${{ vars.SOCIAL_DRAFT_MODE || 'true' }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
        run: python pipeline/run.py ${{ steps.args.outputs.extra }}

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pipeline-run-${{ github.run_id }}
          path: runs/
          retention-days: 7
          if-no-files-found: warn
