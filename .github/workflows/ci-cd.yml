name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Build and test job - runs on all pushes and PRs
  build:
    name: Build Angular App
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        # Production build runs full AOT compile which is a stricter typecheck
        # than `tsc --noEmit` — TS errors fail the build and gate the deploy.
        run: npm run build

      - name: Verify sitemap was regenerated by postbuild
        # postbuild hook runs scripts/generate-sitemap.js. If it failed
        # silently the sitemap would be stale, hurting SEO. Fail loud if the
        # lastmod isn't today's UTC date.
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if ! grep -q "<lastmod>${TODAY}" src/sitemap.xml; then
            echo "::error::sitemap.xml lastmod is not today (${TODAY}). postbuild hook may have failed."
            exit 1
          fi
          echo "Sitemap lastmod = ${TODAY} ✓"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/xsantcastx/browser
          retention-days: 7

  # Quality checks: Playwright (chromium only in CI) + Lighthouse CI
  # Runs in parallel with deploy — does NOT block deploy (continue-on-error: true).
  # TODO: remove continue-on-error once baselines are stable and thresholds confirmed.
  quality-checks:
    name: Quality Checks (Playwright + LHCI)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true   # non-blocking; tighten to false once baselines pass cleanly
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/xsantcastx/browser

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers (chromium only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system deps (cached hit still needs OS libs)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Install serve
        run: npm install -g serve

      - name: Run Playwright visual + smoke tests (chromium only)
        run: npx playwright test --project=chromium
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload visual snapshots (planet F-1 gate artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: e2e/**/*.png
          retention-days: 30

      - name: Run Lighthouse CI
        run: npm run lhci
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  # Deploy to Firebase Hosting (production) - only on main branch pushes
  deploy-production:
    name: Deploy to Production
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/xsantcastx/browser

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_XSANTCASTX_1694B }}'
          channelId: live
          projectId: xsantcastx-1694b

  # Deploy preview for pull requests
  deploy-preview:
    name: Deploy Preview
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/xsantcastx/browser

      - name: Deploy to Firebase Hosting Preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_XSANTCASTX_1694B }}'
          projectId: xsantcastx-1694b
