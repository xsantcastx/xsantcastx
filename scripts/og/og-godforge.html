<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'Orbitron'; src: url('../../src/assets/fonts/orbitron-latin-var.woff2') format('woff2');
               font-weight: 400 900; font-display: block; }
  @font-face { font-family: 'Inter'; src: url('../../src/assets/fonts/inter-latin-var.woff2') format('woff2');
               font-weight: 100 900; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; background: #0a0a0f;
    font-family: 'Inter', system-ui, sans-serif; color: #f6fbff;
  }

  /* ---- nebula field ---- */
  .neb {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 55% 70% at 78% 46%, rgba(139, 92, 246, 0.42), transparent 62%),
      radial-gradient(ellipse 60% 55% at 12% 22%, rgba(123, 97, 255, 0.22), transparent 66%),
      radial-gradient(ellipse 70% 60% at 30% 96%, rgba(139, 34, 82, 0.28), transparent 68%),
      radial-gradient(ellipse 40% 40% at 92% 88%, rgba(232, 117, 42, 0.16), transparent 70%);
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 90% 90% at 50% 50%, transparent 40%, rgba(3, 2, 8, 0.72) 100%);
  }

  /* ---- the eclipse ---- */
  .eclipse { position: absolute; right: 132px; top: 50%; transform: translateY(-50%);
             width: 348px; height: 348px; }
  .corona {
    position: absolute; inset: -70px; border-radius: 50%;
    background: radial-gradient(circle,
      rgba(196, 168, 255, 0.95) 30.5%, rgba(139, 92, 246, 0.85) 34%,
      rgba(139, 92, 246, 0.34) 44%, rgba(123, 97, 255, 0.14) 58%, transparent 74%);
    filter: blur(6px);
  }
  .ember {   /* the forge fire licking the lower limb */
    position: absolute; inset: -70px; border-radius: 50%;
    background: radial-gradient(circle at 50% 74%,
      rgba(232, 117, 42, 0.72) 30%, rgba(201, 168, 76, 0.4) 36%, transparent 52%);
    filter: blur(10px);
  }
  .disc {
    position: absolute; inset: 0; border-radius: 50%; background: #07060c;
    box-shadow: inset 0 0 60px rgba(139, 92, 246, 0.22),
                0 0 0 1px rgba(196, 168, 255, 0.5),
                0 0 90px -10px rgba(139, 92, 246, 0.7);
  }
  .rim {   /* the bright limb — an even chromatic ring, brightest at the top */
    position: absolute; inset: -3px; border-radius: 50%;
    background: conic-gradient(from 300deg,
      rgba(237, 231, 255, 0.95) 0deg, rgba(167, 139, 250, 0.75) 70deg,
      rgba(139, 92, 246, 0.45) 150deg, rgba(232, 117, 42, 0.55) 215deg,
      rgba(139, 92, 246, 0.45) 280deg, rgba(237, 231, 255, 0.95) 360deg);
    -webkit-mask: radial-gradient(circle, transparent 0 48.8%, #000 50.2% 100%);
            mask: radial-gradient(circle, transparent 0 48.8%, #000 50.2% 100%);
    filter: blur(1.4px);
  }
  .ring {  /* dashed orbital */
    position: absolute; inset: -46px; border-radius: 50%;
    border: 1px dashed rgba(167, 139, 250, 0.4);
  }

  /* ---- sigil ---- */
  .sigil { position: absolute; right: 176px; top: 50%; width: 620px; height: 620px;
           transform: translateY(-50%) rotate(-14deg); opacity: 0.16; }

  /* ---- copy ---- */
  .copy { position: absolute; left: 72px; top: 128px; width: 620px; }
  .eyebrow {
    display: flex; align-items: center; gap: 11px;
    font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 17px;
    letter-spacing: 5.5px; color: #C4B5FD; text-transform: uppercase;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #8B5CF6;
         box-shadow: 0 0 12px 2px rgba(139, 92, 246, 0.95); }
  .wordmark {
    margin-top: 20px; font-family: 'Orbitron', sans-serif; font-weight: 900;
    font-size: 92px; line-height: 0.96; letter-spacing: -1px;
    background: linear-gradient(103deg, #EDE7FF 4%, #A78BFA 34%, #8B5CF6 60%, #C9A84C 99%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 5px 30px rgba(139, 92, 246, 0.5));
  }
  .tagline { margin-top: 22px; font-size: 30px; font-weight: 600; color: #EAE4FF;
             letter-spacing: -0.3px; }
  .sub { margin-top: 11px; font-size: 20px; font-weight: 400; color: rgba(214, 205, 240, 0.72); }

  /* ---- stats ---- */
  .stats { position: absolute; left: 74px; bottom: 74px; display: flex; gap: 54px; }
  .stat__n { font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 31px; line-height: 1; }
  .stat__l { margin-top: 8px; font-size: 14px; font-weight: 500; letter-spacing: 2.4px;
             text-transform: uppercase; color: rgba(206, 198, 232, 0.62); }
  .rule { position: absolute; left: 74px; bottom: 158px; width: 566px; height: 1px;
          background: linear-gradient(90deg, rgba(139,92,246,0.85), rgba(201,168,76,0.35) 55%, transparent); }

  .url { position: absolute; right: 56px; bottom: 34px;
         font-family: 'Orbitron', sans-serif; font-weight: 600; font-size: 21px;
         letter-spacing: 3.6px; color: rgba(167, 139, 250, 0.88); }
  .star { position: absolute; border-radius: 50%; }
</style></head>
<body>
  <div class="neb"></div>

  <!-- constellation -->
  <svg width="1200" height="630" style="position:absolute;inset:0" id="stars"></svg>

  <svg class="sigil" viewBox="0 0 800 800" fill="none"
       stroke="rgb(167,139,250)" stroke-width="1.1">
    <circle cx="400" cy="400" r="390"/><circle cx="400" cy="400" r="330"/>
    <circle cx="400" cy="400" r="215"/><circle cx="400" cy="400" r="132"/>
    <polygon points="400,70 686,566 114,566"/><polygon points="400,730 114,234 686,234"/>
    <line x1="14" y1="400" x2="786" y2="400"/><line x1="400" y1="14" x2="400" y2="786"/>
    <line x1="86" y1="86" x2="714" y2="714"/><line x1="714" y1="86" x2="86" y2="714"/>
  </svg>

  <div class="eclipse">
    <div class="corona"></div><div class="ember"></div>
    <div class="ring"></div><div class="disc"></div><div class="rim"></div>
  </div>

  <div class="vignette"></div>

  <div class="copy">
    <div class="eyebrow"><span class="dot"></span>Free Browser Tools</div>
    <div class="wordmark">THE<br>GODFORGE</div>
    <div class="tagline">Tools forged in the Eclipse.</div>
    <div class="sub">No sign-up. No installs. Just useful things.</div>
  </div>

  <div class="rule"></div>
  <div class="stats">
    <div><div class="stat__n" style="color:#A78BFA">123+</div><div class="stat__l">Free Tools</div></div>
    <div><div class="stat__n" style="color:#E0A857">Always</div><div class="stat__l">Free</div></div>
    <div><div class="stat__n" style="color:#C4B5FD">Built</div><div class="stat__l">In Public</div></div>
  </div>

  <div class="url">XSANTCASTX.COM</div>

<script>
  // Deterministic starfield — a tiny LCG so the render is byte-stable.
  var seed = 20260812;
  function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
  var COLORS = ['#A78BFA', '#8B5CF6', '#C4B5FD', '#E0A857', '#EDE7FF', '#7b61ff'];
  var svg = document.getElementById('stars');
  var pts = [];
  for (var i = 0; i < 46; i++) {
    var x = rnd() * 1200, y = rnd() * 630;
    // keep the copy block legible
    if (x < 700 && y > 100 && y < 430) continue;
    var r = 1 + rnd() * 2.1, c = COLORS[(rnd() * COLORS.length) | 0];
    pts.push([x, y]);
    svg.insertAdjacentHTML('beforeend',
      '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r.toFixed(2) +
      '" fill="' + c + '" opacity="' + (0.35 + rnd() * 0.6).toFixed(2) + '"/>');
  }
  // constellation lines between near neighbours
  for (var a = 0; a < pts.length; a++) for (var b = a + 1; b < pts.length; b++) {
    var dx = pts[a][0] - pts[b][0], dy = pts[a][1] - pts[b][1], d = Math.sqrt(dx * dx + dy * dy);
    if (d < 132) svg.insertAdjacentHTML('afterbegin',
      '<line x1="' + pts[a][0].toFixed(1) + '" y1="' + pts[a][1].toFixed(1) + '" x2="' +
      pts[b][0].toFixed(1) + '" y2="' + pts[b][1].toFixed(1) +
      '" stroke="rgba(139,92,246,' + (0.3 * (1 - d / 132)).toFixed(3) + ')" stroke-width="1"/>');
  }
</script>
</body></html>
