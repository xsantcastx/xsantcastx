<div class="donation-feed-container">
  <h3>Latest Donations</h3>
  @if (donations.length > 0) {
    <div class="feed">
      @for (donation of donations; track donation) {
        <div class="feed-item">
          <p class="message">"{{ donation.message }}"</p>
          <!-- An ISO string, not a Firestore Timestamp: the feed is cached, and
               a Timestamp does not survive the round trip through JSON. The
               date pipe parses the string directly. -->
          <p class="timestamp">{{ donation.createdAt | date:'short' }}</p>
        </div>
      }
    </div>
  } @else {
    <p>No donations yet. Be the first!</p>
  }
</div>
