<section class="ks" [class.ks--compact]="compact" [attr.aria-label]="heading">
  <h3 class="ks__head">{{ heading }}</h3>
  <dl class="ks__list">
    @for (key of keys; track key) {
      @if (visible(key)) {
        <div class="ks__row"
             [class.ks__row--zero]="shown()[key] === 0 && !flash()[key]"
             [class.ks__row--up]="flash()[key] === 'up'"
             [class.ks__row--down]="flash()[key] === 'down'">
          <dt class="ks__label">{{ labels[key] }}</dt>
          <dd class="ks__value">{{ format(key, shown()[key]) }}</dd>
        </div>
      }
    }
    @if (combat) {
      <div class="ks__row ks__row--combat" [class.ks__row--up]="flash()['strikePower'] === 'up'" [class.ks__row--down]="flash()['strikePower'] === 'down'">
        <dt class="ks__label">Damage</dt>
        <dd class="ks__value">{{ combatShown().damage }}</dd>
      </div>
      <div class="ks__row ks__row--combat" [class.ks__row--up]="flash()['ward'] === 'up'" [class.ks__row--down]="flash()['ward'] === 'down'">
        <dt class="ks__label">Max HP</dt>
        <dd class="ks__value">{{ combatShown().maxHp }}</dd>
      </div>
    }
  </dl>
  <!-- Polite, so a screen reader hears "+1.3 Strike" after an equip without
       it interrupting whatever it was reading. -->
  <div class="ks__chips" aria-live="polite">
    @for (chip of chips(); track chip.id) {
      <span class="ks__chip"
            [class.ks__chip--still]="reduced"
            [class.ks__chip--up]="chip.direction === 'up'"
            [class.ks__chip--down]="chip.direction === 'down'">{{ chip.text }}</span>
    }
  </div>
</section>
