<section class="km" [attr.data-saved]="saved ? '1' : '0'">
  <p class="km__lore">{{ t('look.lore') }}</p>

  <!-- The class (owner 2026-10-20: one class first, done right; design-bible §4.4: the Ashguard second; §4.3: the
       Lanternwright third). Chosen once:
       a made Keeper keeps the calling they were made with. -->
  <div class="km__class" role="radiogroup" [attr.aria-label]="t('look.class')">
    <span class="km__label">{{ t('look.class') }}</span>
    <div class="km__classes">
      <button type="button" class="km__classcard" role="radio" [attr.aria-checked]="draft.vocation === 'warlock'" data-vocation="warlock"
              [disabled]="locked && draft.vocation !== 'warlock'" (click)="setVocation('warlock')">
        <svg viewBox="0 0 16 16" width="36" height="36" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="7" y="4" width="2" height="12" fill="#6e4526"/><rect x="7" y="4" width="1" height="12" fill="#a06a3b"/>
          <rect x="5" y="1" width="6" height="5" fill="#3b2140"/><rect x="6" y="2" width="4" height="3" fill="#b06bff"/><rect x="7" y="2" width="2" height="2" fill="#ffd25a"/>
        </svg>
        <span><b>{{ t('look.class.warlock') }}</b><small>{{ t('look.class.warlock.blurb') }}</small></span>
      </button>
      <button type="button" class="km__classcard" role="radio" [attr.aria-checked]="draft.vocation === 'ashguard'" data-vocation="ashguard"
              [disabled]="locked && draft.vocation !== 'ashguard'" (click)="setVocation('ashguard')">
        <svg viewBox="0 0 16 16" width="36" height="36" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="1" y="4" width="7" height="9" fill="#8a6a2a"/><rect x="2" y="5" width="5" height="7" fill="#e0b25a"/><rect x="3" y="6" width="3" height="5" fill="#4a332c"/><rect x="4" y="7" width="1" height="3" fill="#ff7a2e"/>
          <rect x="11" y="1" width="2" height="10" fill="#c3cad6"/><rect x="11" y="1" width="1" height="10" fill="#f2f5fa"/><rect x="9" y="11" width="6" height="1" fill="#c99a3e"/><rect x="11" y="12" width="2" height="3" fill="#6e4526"/>
          <rect x="13" y="3" width="1" height="1" fill="#ffb347"/><rect x="10" y="5" width="1" height="1" fill="#e2552a"/>
        </svg>
        <span><b>{{ t('look.class.ashguard') }}</b><small>{{ t('look.class.ashguard.blurb') }}</small></span>
      </button>
      <button type="button" class="km__classcard" role="radio" [attr.aria-checked]="draft.vocation === 'lanternwright'" data-vocation="lanternwright"
              [disabled]="locked && draft.vocation !== 'lanternwright'" (click)="setVocation('lanternwright')">
        <svg viewBox="0 0 16 16" width="36" height="36" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="7" y="7" width="2" height="9" fill="#6e4526"/><rect x="7" y="7" width="1" height="9" fill="#a06a3b"/><rect x="7" y="11" width="2" height="1" fill="#c99a3e"/>
          <rect x="7" y="0" width="2" height="1" fill="#8a6a3a"/><rect x="5" y="1" width="6" height="1" fill="#c99a3e"/>
          <rect x="4" y="2" width="1" height="4" fill="#c99a3e"/><rect x="11" y="2" width="1" height="4" fill="#8a6a3a"/><rect x="5" y="2" width="6" height="4" fill="#ffd27a"/>
          <rect x="6" y="3" width="4" height="2" fill="#fffbe8"/><rect x="7" y="3" width="1" height="1" fill="#ffffff"/><rect x="4" y="6" width="8" height="1" fill="#c99a3e"/>
          <rect x="2" y="2" width="1" height="1" fill="#fff2a8"/><rect x="13" y="3" width="1" height="1" fill="#fff2a8"/><rect x="1" y="5" width="1" height="1" fill="#ffd27a"/><rect x="14" y="6" width="1" height="1" fill="#ffd27a"/>
        </svg>
        <span><b>{{ t('look.class.lanternwright') }}</b><small>{{ t('look.class.lanternwright.blurb') }}</small></span>
      </button>
    </div>
    <small class="km__more">{{ t(locked ? 'look.class.locked' : 'look.class.more') }}</small>
  </div>

  <div class="km__stage">
    <canvas #preview class="km__preview" width="240" height="240" role="img" [attr.aria-label]="t('look.preview')"></canvas>
  </div>

  <label class="km__name">
    <span>{{ t('look.name') }}</span>
    <input type="text" [value]="draft.name" [attr.maxlength]="nameMax" [placeholder]="t('look.namePlaceholder')"
           autocomplete="off" spellcheck="false" (input)="setName($any($event.target).value)">
  </label>

  <ul class="km__fields">
    @for (field of fields; track field) {
      <li class="km__row" [attr.data-field]="field">
        <span class="km__label">{{ fieldLabel(field) }}</span>
        <button type="button" class="km__step km__step--prev" (click)="step(field, -1)" [attr.aria-label]="t('look.prev', { field: fieldLabel(field) })"><i aria-hidden="true"></i></button>
        <span class="km__value" aria-live="polite">
          @if (swatch(field); as color) { <i class="km__swatch" [style.--swatch]="color" aria-hidden="true"></i> }
          {{ valueLabel(field) }}
        </span>
        <button type="button" class="km__step km__step--next" (click)="step(field, 1)" [attr.aria-label]="t('look.next', { field: fieldLabel(field) })"><i aria-hidden="true"></i></button>
      </li>
    }
  </ul>

  <div class="km__actions">
    <button type="button" class="km__random" (click)="surprise()">{{ t('look.random') }}</button>
    <button type="button" class="km__keep" (click)="keep()">{{ t('look.keep') }}</button>
  </div>
  @if (saved) { <p class="km__saved" role="status">{{ t('look.saved') }}</p> }
</section>
