<section class="hb" aria-labelledby="hb-title">
  <header class="hb__head">
    <div>
      <h2 id="hb-title">{{ t('hub.bank.title') }}</h2>
      <p>{{ t('hub.bank.tag', { n: rows.length }) }}</p>
    </div>
    <button
      type="button"
      class="hb__filters-toggle"
      [attr.aria-expanded]="filtersOpen"
      (click)="filtersOpen = !filtersOpen">
      {{ t('hub.bank.filters') }}
    </button>
  </header>

  <form class="hb__filters" [class.is-open]="filtersOpen" (submit)="$event.preventDefault()">
    <div class="hb__kinds" role="group" [attr.aria-label]="t('hub.bank.kinds')">
      @for (opt of kinds; track opt) {
        <button
          type="button"
          class="hb__kind"
          [class.is-on]="kind === opt"
          (click)="kind = opt">
          {{ t('hub.bank.kind.' + opt) }}
        </button>
      }
    </div>
    <label class="hb__search">
      <span>{{ t('hub.bank.search') }}</span>
      <input type="search" [value]="query" (input)="query = $any($event.target).value">
    </label>
  </form>

  @if (!rows.length) {
    <p class="hb__empty">{{ t('hub.bank.empty') }}</p>
  } @else {
    <ul class="hb__grid">
      @for (row of rows; track row.id) {
        <li class="hb__tile" [class.is-on]="selectedId === row.id" [attr.data-kind]="row.kind">
          <button type="button" class="hb__face" (click)="select(row)" [attr.aria-pressed]="selectedId === row.id">
            @if (row.art) {
              <img class="hb__art" [src]="row.art" alt="" width="40" height="40" decoding="async">
            } @else {
              <span class="hb__orb" aria-hidden="true">{{ row.name.slice(0, 2) }}</span>
            }
            <span class="hb__name">{{ row.name }}</span>
            <span class="hb__meta">{{ row.meta }}</span>
            <span class="hb__qty">×{{ row.qty }}</span>
          </button>
          @if (selectedId === row.id && row.inspectType && row.inspectId) {
            <app-inspect-button [type]="row.inspectType" [id]="row.inspectId" />
          }
        </li>
      }
    </ul>
  }
</section>
