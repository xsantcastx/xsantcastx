<nav class="navbar">
  <!-- Glass blur layer (kept as a child so the navbar itself is not a containing
       block for the fixed-position mobile menu/backdrop) -->
  <span class="navbar__glass" aria-hidden="true"></span>

  <!-- Mobile Menu Backdrop -->
  <div class="mobile-backdrop" [class.show]="mobileMenuOpen" (click)="closeMobileMenu()" aria-hidden="true"></div>

  <button type="button" class="logo" (click)="scrollToSection('hero')" aria-label="Jump to top">
    <span class="logo-mark">
      <img src="assets/logo-xsantcastx.svg" alt="xsantcastx logo" decoding="async" draggable="false" width="64" height="64" />
    </span>
    <span class="logo-lockup">
      <span class="nav-glitch">xsantcastx</span>
      <span class="nav-buzzword" aria-hidden="true" [attr.data-swap]="wordSwapToggle">{{ activeWord }}</span>
    </span>
  </button>

  <!-- Mobile Controls -->
  <div class="mobile-controls">
    <!-- Language Toggle (always visible) -->
    <div class="language-toggle">
      <button class="lang-btn" [class.active]="currentLang === 'en'" (click)="setLanguage('en')">EN</button>
      <button class="lang-btn" [class.active]="currentLang === 'es'" (click)="setLanguage('es')">ES</button>
    </div>

    <!-- Hamburger Menu -->
    <button class="hamburger" [class.active]="mobileMenuOpen" (click)="toggleMobileMenu()"
      aria-label="Toggle navigation menu"
      [attr.aria-expanded]="mobileMenuOpen"
      aria-haspopup="menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <!-- Navigation Menu -->
  <nav class="nav-menu" [class.mobile-open]="mobileMenuOpen" aria-label="Main navigation">
    <a href="#services" [class.active]="currentSection === 'services'" (click)="scrollToSection('services'); closeMobileMenu(); $event.preventDefault()">{{ translate('nav.services') }}</a>
    <a href="#projects" [class.active]="currentSection === 'projects'" (click)="scrollToSection('projects'); closeMobileMenu(); $event.preventDefault()">{{ translate('nav.projects') }}</a>
    <a href="#about" [class.active]="currentSection === 'about'" (click)="scrollToSection('about'); closeMobileMenu(); $event.preventDefault()">{{ translate('nav.about') }}</a>
    <a href="#contact" [class.active]="currentSection === 'contact'" (click)="scrollToSection('contact'); closeMobileMenu(); $event.preventDefault()">{{ translate('nav.contact') }}</a>
    <a routerLink="/tools" routerLinkActive="active" (click)="closeMobileMenu()">Tools</a>
    <a routerLink="/blueprint" routerLinkActive="active" (click)="closeMobileMenu()">Blueprint</a>
    <a routerLink="/mcp" routerLinkActive="active" (click)="closeMobileMenu()">MCP</a>
    <a routerLink="/games" routerLinkActive="active" class="nav-games-link" (click)="closeMobileMenu()">🕹️ Games</a>
    <a routerLink="/live" routerLinkActive="active" class="nav-live-link" (click)="closeMobileMenu()">
      <span class="nav-live-dot"></span>LIVE
    </a>
    <!-- Drawer copy of the progression readout. The header row is already at
         ~375px on a small phone, so the navbar instance is hidden below the
         drawer breakpoint and this one takes over. -->
    <app-xp-bar class="nav-xp nav-xp--drawer"></app-xp-bar>
  </nav>

  <!-- Progression readout — rank, split Aether/Nox bar, streak -->
  <app-xp-bar class="nav-xp"></app-xp-bar>

  <!-- Desktop Language Toggle -->
  <div class="language-toggle desktop-only">
    <button class="lang-btn" [class.active]="currentLang === 'en'" (click)="setLanguage('en')">EN</button>
    <button class="lang-btn" [class.active]="currentLang === 'es'" (click)="setLanguage('es')">ES</button>
  </div>

  <div class="nav-progress"></div>
</nav>
