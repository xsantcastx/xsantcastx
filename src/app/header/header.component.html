<nav class="navbar">
  <!-- Glass blur layer (kept as a child so the navbar itself is not a containing
       block for the fixed-position mobile menu/backdrop) -->
  <span class="navbar__glass" aria-hidden="true"></span>

  <!-- Mobile Menu Backdrop -->
  <div class="mobile-backdrop" [class.show]="mobileMenuOpen" (click)="closeMobileMenu()" aria-hidden="true"></div>

  <button type="button" class="logo" (click)="scrollToSection('hero')" aria-label="Jump to top">
    <span class="logo-mark">
      <img src="assets/logo-xsantcastx.svg" alt="xsantcastx logo" decoding="async" draggable="false" width="64" height="64" />
    </span>
    <span class="logo-lockup">
      <span class="nav-glitch">xsantcastx</span>
      <span class="nav-buzzword" aria-hidden="true" [attr.data-swap]="wordSwapToggle">{{ activeWord }}</span>
    </span>
  </button>

  <!-- Mobile Controls -->
  <div class="mobile-controls">
    <!-- Language Toggle (always visible) -->
    <div class="language-toggle">
      <button class="lang-btn" [class.active]="currentLang === 'en'" (click)="setLanguage('en')">EN</button>
      <button class="lang-btn" [class.active]="currentLang === 'es'" (click)="setLanguage('es')">ES</button>
    </div>

    <!-- Quest log trigger. The panel it opens is mounted next to the header,
         not in it — see QuestDrawerComponent's header comment. -->
    <app-quest-trigger class="nav-quests--mobile"></app-quest-trigger>

    <!-- Hamburger Menu -->
    <button class="hamburger" [class.active]="mobileMenuOpen" (click)="toggleMobileMenu()"
      aria-label="Toggle navigation menu"
      [attr.aria-expanded]="mobileMenuOpen"
      aria-haspopup="menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <!-- Navigation Menu -->
  <nav class="nav-menu" [class.mobile-open]="mobileMenuOpen" aria-label="Main navigation">
    <a href="#services" [class.active]="currentSection === 'services'" (click)="scrollToSection('services'); closeMobileMenu(); $event.preventDefault()">{{ translate('nav.services') }}</a>
    <a href="#projects" [class.active]="currentSection === 'projects'" (click)="scrollToSection('projects'); closeMobileMenu(); $event.preventDefault()">{{ translate('nav.projects') }}</a>
    <a href="#about" [class.active]="currentSection === 'about'" (click)="scrollToSection('about'); closeMobileMenu(); $event.preventDefault()">{{ translate('nav.about') }}</a>
    <a href="#contact" [class.active]="currentSection === 'contact'" (click)="scrollToSection('contact'); closeMobileMenu(); $event.preventDefault()">{{ translate('nav.contact') }}</a>
    <a routerLink="/tools" routerLinkActive="active" (click)="closeMobileMenu()">Tools</a>
    <!-- Mid-row on purpose: the tail of this row overflows into the EN/ES
         toggle below ~1440px (a pre-existing defect, see header.component.css),
         so a link added at the end would be unreachable on a 1280px laptop. -->
    <a routerLink="/codex" routerLinkActive="active" class="nav-codex-link" (click)="closeMobileMenu()"
       [attr.aria-label]="'Codex — ' + codexFound + ' of ' + codexTotal + ' fragments discovered'">
      📜 Codex
      <span class="nav-codex-badge" aria-hidden="true">{{ codexFound }}/{{ codexTotal }}</span>
    </a>
    <!-- Mid-row for the same reason the Codex link is: the tail of this row
         overflows into the EN/ES toggle below ~1440px, so a link appended at
         the end is unreachable on a 1280px laptop. -->
    <a routerLink="/market" routerLinkActive="active" class="nav-market-link" (click)="closeMobileMenu()">🪙 Market</a>
    <a routerLink="/blueprint" routerLinkActive="active" (click)="closeMobileMenu()">Blueprint</a>
    <a routerLink="/mcp" routerLinkActive="active" (click)="closeMobileMenu()">MCP</a>
    <a routerLink="/arena" routerLinkActive="active" class="nav-games-link" (click)="closeMobileMenu()">⚔️ Arena</a>
    <a routerLink="/quests" routerLinkActive="active" class="nav-quests-link" (click)="closeMobileMenu()">Quests</a>
    <a routerLink="/live" routerLinkActive="active" class="nav-live-link" (click)="closeMobileMenu()">
      <span class="nav-live-dot"></span>LIVE
    </a>
    <!-- Drawer copy of the progression readout. The header row is already at
         ~375px on a small phone, so the navbar instance is hidden below the
         drawer breakpoint and this one takes over. -->
    <!-- Drawer copies of the wallet and the progression readout. The header row
         is already at ~375px on a small phone, so the navbar instances are
         hidden below the drawer breakpoint and these take over. -->
    <app-currency-rail class="nav-coins nav-coins--drawer"></app-currency-rail>
    <app-xp-bar class="nav-xp nav-xp--drawer"></app-xp-bar>

    <!-- The forge's drawer copy used to sit here. The Godforge Market gave the
         flame a fixed home in the bottom-right corner of every page, which is
         reachable on a phone without opening the drawer at all — so this copy
         was a second, smaller, worse button for the same swing. The Ambient
         Forge still accrues from IdleService, not from any component, so
         nothing about idling depends on this element having existed. -->
  </nav>

  <!-- Desktop dock: the quest sword and the progression readout, docked under
       the navbar rather than in it. The nav row has no spare horizontal space
       at 1280px (see .nav-xp in the stylesheet) — adding a 44px control to it
       would push LIVE over the language toggle. -->
  <div class="nav-dock">
    <app-quest-trigger class="nav-quests"></app-quest-trigger>
    <app-currency-rail class="nav-coins"></app-currency-rail>
    <app-xp-bar class="nav-xp"></app-xp-bar>
  </div>

  <!-- Desktop Language Toggle -->
  <div class="language-toggle desktop-only">
    <button class="lang-btn" [class.active]="currentLang === 'en'" (click)="setLanguage('en')">EN</button>
    <button class="lang-btn" [class.active]="currentLang === 'es'" (click)="setLanguage('es')">ES</button>
  </div>

  <div class="nav-progress"></div>
</nav>
