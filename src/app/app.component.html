<!-- Game-only shell (docs/handoff/game-only-shell.md). The game at /play is the
     whole site: no site header, footer, tab bar, command palette, boot curtain,
     WebGL backdrop, corner Forge Flame, NPC portrait or "forged today" counter.
     Every navigation the header and footer used to offer lives in the game's
     menu (Character, Sound, Account & settings), every old page URL is a router
     redirect into the world, and an unknown URL lands in the game too. The only
     route left outside /play is the owner's /admin, which links back to it. -->
<main id="main-content" [class.play-mode]="isPlayMode">
  <router-outlet></router-outlet>
</main>

<!-- GDPR Cookie Banner. On /play it is the compact in-world bar, docked under
     the game frame (the frame shrinks by its height) rather than over it. The
     choice can be changed later from the game menu (Account & settings). -->
<app-cookie-banner [world]="isPlayMode"></app-cookie-banner>

<!-- Installed-app chrome: the offline/back-online pill, the desktop title-bar
     strip, and the game route's gesture class. The pill is pointer-events:
     none, so it cannot take a tap. -->
<app-pwa-outlet kind="chrome"></app-pwa-outlet>

<!-- "A new version is ready — Reload". Top-centre (an installed app or a
     long-open tab never navigates, so it would otherwise run an old bundle for
     days). Hidden while a panel, modal or fight is up; never reloads without a
     tap. See shared/pwa/app-update.service.ts. -->
<app-pwa-outlet kind="update"></app-pwa-outlet>

<!-- "Which save wins" — opens when signing in finds two saves that each hold
     something the other does not. Mounted here rather than next to the sign-in
     button (the game menu: Account & settings, or the Character panel) because it is a
     fixed full-viewport dialog, and inside the game's place panel it would be
     clipped to the panel. It renders nothing until a conflict exists. -->
<app-cloud-save-merge-dialog></app-cloud-save-merge-dialog>

<!-- "Another device is active" — the write lease. Renders nothing unless this
     device is passive. -->
<app-device-lease-banner></app-device-lease-banner>

<!-- "You have been banned" and the site-wide announcement strip. An outlet: it
     renders nothing on the overwhelming majority of loads, so its markup and
     stylesheet arrive through a dynamic import on the rare load that needs
     them. -->
<app-site-notice-outlet></app-site-notice-outlet>
