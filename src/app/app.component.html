<a href="#main-content" class="skip-to-main">Skip to main content</a>
@if (!isEmbedMode) {
  <div class="particle-layer"></div>
}
@if (!isEmbedMode) {
  <app-header></app-header>
}

<main id="main-content" [class.embed-mode]="isEmbedMode" [class.embed-theme-light]="isEmbedMode && embed.theme === 'light'">
  <router-outlet></router-outlet>
</main>

@if (isEmbedMode && showEmbedBranding) {
  <app-embed-bar></app-embed-bar>
}
@if (!isEmbedMode) {
  <app-footer></app-footer>
}

<!-- GDPR Cookie Banner -->
@if (!isEmbedMode) {
  <app-cookie-banner></app-cookie-banner>
}

<!-- Mystery milestone celebration -->
@if (!isEmbedMode) {
  <app-milestone-effect></app-milestone-effect>
}

<!-- Achievement drop — rarity-tiered replacement for the flat egg toast -->
@if (!isEmbedMode) {
  <app-achievement-drop></app-achievement-drop>
}

<!-- Quest board. Deliberately a sibling of <app-header>, not a child of it:
     inside .navbar it would join a z-index:1000 stacking context and paint over
     the logo and the language toggle. -->
@if (!isEmbedMode) {
  <app-quest-drawer></app-quest-drawer>
}

<!-- Quest claims and lore unlocks -->
@if (!isEmbedMode) {
  <app-quest-toast></app-quest-toast>
}

<!-- Site-wide Cmd+K / Ctrl+K command palette -->
@if (!isEmbedMode) {
  <app-command-palette></app-command-palette>
}
