<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- The document title is a placeholder: AppTitleStrategy overwrites it on
       every navigation, and the prerender writes the real per-route title into
       each static page. It matters only for the split second before Angular
       boots, so it carries the platform name and nothing route-specific. -->
  <title>Eclipse Realms</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Free idle RPG in your browser. Strike the forge for Gold, gamble it on runes, craft gear with rolled stats, and send explorers into five realms. Diablo-style loot. No sign-up, no install.">
  <meta name="keywords" content="eclipse realms, persistent world, five realms, artifacts, rune forge, trials, character, xsantcastx">
  <meta name="author" content="xsantcastx">
  <!-- The shell is not a page, and this tag only ever reaches a crawler as one.
       Hosting rewrites `**` to index.csr.html, so these bytes are served for
       exactly one class of URL: paths that are neither a prerendered route nor
       a configured 301 — retired links, invented paths, crawler guesses. Those
       all resolve, once Angular boots, to the `**` route's soft 404. Shipping
       `index, follow` here meant every one of them answered 200 with an
       indexable, canonical-less document whose only strong signal was an
       hreflang pointing at /world — an unbounded supply of near-identical
       pages for Google to cluster and then canonicalise somewhere of its own
       choosing.

       Every route that IS meant to be indexed is prerendered, and SeoService
       overwrites this tag with `index, follow` while prerendering it — the
       built pages carry the right value, verifiably (only /404 and /admin
       keep noindex, from their own route data). scripts/generate-sitemap.js
       fails the build if a sitemap URL ever loses its prerendered file, so a
       future indexable route cannot quietly inherit this default. -->
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0a0a0f">

  <!-- Open Graph -->
  <meta property="og:type"        content="website">
  <meta property="og:site_name"   content="Eclipse Realms">
  <meta property="og:title"       content="Eclipse Realms — Free Idle RPG in Your Browser">
  <meta property="og:description" content="Free idle RPG in your browser. Strike the forge for Gold, gamble it on runes, craft gear with rolled stats, and send explorers into five realms. Diablo-style loot. No sign-up, no install.">
  <!-- /play, not the apex: `/` is a 301 to /play, and an og:url that
       redirects makes a scraper resolve one extra hop to find the page it is
       already looking at. SeoService overwrites this per route. -->
  <meta property="og:url"         content="https://xsantcastx.com/play">
  <!-- One raster image, no SVG. The previous pair advertised an SVG first with a
       JPEG fallback, but og:image is not a fallback list — Facebook, LinkedIn,
       Discord and iMessage all reject image/svg+xml outright, and the crawlers
       that do read the second tag treated the pair as a gallery. A single
       1200x630 JPEG is the only thing every scraper agrees on. -->
  <meta property="og:image"            content="https://xsantcastx.com/assets/og/og-godforge.jpg">
  <meta property="og:image:type"       content="image/jpeg">
  <meta property="og:image:width"      content="1200">
  <meta property="og:image:height"     content="630">
  <meta property="og:image:alt"        content="Eclipse Realms — a violet-lit anvil on a stone altar beneath an eclipse, ringed by broken pillars">
  <meta property="og:locale"           content="en_US">

  <!-- Twitter Card -->
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:site"        content="@xsantcastx">
  <meta name="twitter:creator"     content="@xsantcastx">
  <meta name="twitter:title"       content="Eclipse Realms — Free Idle RPG in Your Browser">
  <meta name="twitter:description" content="Free idle RPG in your browser. Strike the forge for Gold, gamble it on runes, craft gear with rolled stats, and send explorers into five realms. Diablo-style loot. No sign-up, no install.">
  <meta name="twitter:image"       content="https://xsantcastx.com/assets/og/og-godforge.jpg">
  <meta name="twitter:image:alt"   content="Eclipse Realms — a violet-lit anvil on a stone altar beneath an eclipse, ringed by broken pillars">

  <!-- Canonical: set dynamically per route by SeoService -->

  <!-- hreflang: deliberately absent. It annotates a set of URLs serving the
       same page in different languages, and there is no such set here — one
       URL serves both, and the language is a client-side preference read from
       `?lang=` or localStorage. The trio that used to stand here advertised
       `?lang=es` as a distinct page. Nothing ever rendered that URL: there is
       no live SSR, and Hosting ignores the query string when it matches a
       static file, so `/world?lang=es` was answered with the English
       `world/index.html`, whose canonical link points at the bare /world — an
       alternate that canonicalised itself away. Search Console reported the
       whole set as "Alternate page with proper canonical tag". See the
       matching note in seo.service.ts.

       No literal tag markup in this comment on purpose: it is the first thing
       in the file, so a grep for a head tag would match here and report the
       shell's comment instead of the tag the page actually ships. -->

  <!-- Favicons — the Void X sigil. favicon.svg is a redraw of the sigil art for
       browsers that take SVG icons; the PNGs are the same mark rasterised, and
       favicon.ico is the multi-resolution fallback older crawlers still ask for
       at /favicon.ico whether or not it is linked. -->
  <link rel="icon"           type="image/svg+xml" href="favicon.svg">
  <link rel="icon"           type="image/png" sizes="32x32" href="assets/brand/icon-32.png">
  <link rel="icon"           type="image/png" sizes="16x16" href="assets/brand/icon-16.png">
  <link rel="shortcut icon"  type="image/x-icon"            href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180"    href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- The installed app on iOS / iPadOS, which reads none of the manifest's
       display or splash fields. Status bar "black" rather than
       "black-translucent" on purpose: translucent draws the page under the
       status bar, and the app's start page (/play, the game canvas) does not
       pad for safe-area-inset-top — its HUD would sit behind the clock.

       Startup images: portrait only, one per current iPhone / iPad logical
       size. Safari fetches only the one whose media query matches, and only
       when the visitor adds the app to the home screen, so the set costs page
       weight only in these tags. A device with no match falls back to a plain
       screen of the theme colour; landscape launch does the same. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Eclipse Realms">
  <meta name="application-name" content="Eclipse Realms">
  <link rel="apple-touch-startup-image" href="assets/brand/splash/splash-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="assets/brand/splash/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="assets/brand/splash/splash-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="assets/brand/splash/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="assets/brand/splash/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="assets/brand/splash/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="assets/brand/splash/splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="assets/brand/splash/splash-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="assets/brand/splash/splash-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="assets/brand/splash/splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="assets/brand/splash/splash-1080x2340.png" media="(device-width: 360px) and (device-height: 780px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="assets/brand/splash/splash-2048x2732.png" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="assets/brand/splash/splash-1668x2388.png" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="assets/brand/splash/splash-1640x2360.png" media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="assets/brand/splash/splash-1536x2048.png" media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">

  <!-- Preconnects for performance -->
  <link rel="preconnect" href="https://www.google.com">

  <!-- Self-hosted font preloads (§3.2) — latin variable fonts for above-the-fold Orbitron headings + Inter body -->
  <link rel="preload" href="/assets/fonts/orbitron-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/pixelify-sans-600-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/cormorant-garamond-latin-var.woff2" as="font" type="font/woff2" crossorigin>


  <!-- Global JSON-LD — the site and its author. The game itself (VideoGame)
       is described on /play, which carries the full graph. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://xsantcastx.com/#website",
        "url": "https://xsantcastx.com",
        "name": "Eclipse Realms",
        "alternateName": "The Godforge",
        "description": "A free idle RPG in the browser — forge Gold, gamble runes, craft gear with rolled stats, and send explorers into five realms.",
        "inLanguage": "en-US"
      },
      {
        "@type": "Person",
        "@id": "https://xsantcastx.com/#person",
        "name": "xsantcastx",
        "url": "https://xsantcastx.com"
      }
    ]
  }
  </script>

  <!-- reCAPTCHA is NOT loaded here on purpose. Firebase App Check's
       ReCaptchaV3Provider injects its own api.js?render=<siteKey> tag when it
       initializes; a bare api.js tag in <head> is render-blocking on every
       route, has no ?render= param so App Check can't use it anyway, and
       nothing in the app touches window.grecaptcha directly. -->

  <!-- ░▒▓█ BOOT RECOVERY █▓▒░ — must stay in <head> and ahead of the module
       scripts the build injects into <body>: it is the only error handler that
       still exists when main.js's own module graph is what failed to link. A
       classic script rather than a module, deliberately — it has no import
       graph of its own to go down with. See the file header for the full
       account of what poisons a client and why only this can reach it. -->
  <script src="/assets/js/boot-recovery.js" defer></script>

</head>
<body>
  <app-root></app-root>
</body>
</html>
