  <!-- hreflang: these are the homepage's pair, and act as the fallback for the
       SPA shell (index.csr.html) where no route has resolved yet. SeoService
       rewrites all three per route on every NavigationEnd, so prerendered pages
       ship their own self-referential set rather than inheriting the homepage's.
       Targets are /world, not /, because / is a 301 to /world and an hreflang
       pointing at a redirect is discarded. -->

       at /favicon.ico whether or not it is linked. -->

       Inline event handlers are not covered by script-src hashes (they need

  <link rel="stylesheet" media="print" id="fa-css"

  <!-- ░▒▓█ GODFORGE BOOT — first-visit vs. returning-visit cut █▓▒░
       Inline, synchronous, and in <head> on purpose. The boot sequence is
       driven entirely by CSS on the prerendered <app-godforge-loader>, so the
       full-vs-short decision has to be on the element before the first frame —
       Angular has not booted yet, and localStorage does not exist during
       prerender, so neither can make this call. First visit gets all 2.9s;
       every visit after starts at stage 5 and runs 1.3s. -->
  <script>
    (function () {
      try {
        var k = 'godforge-boot-seen';
        if (localStorage.getItem(k)) {
          document.documentElement.classList.add('gf-boot-short');
        }
        localStorage.setItem(k, '1');
      } catch (e) {
        /* Private mode or storage disabled — fall through to the full cut. */
      }
    })();
  </script>
