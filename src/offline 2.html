<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- The offline shell. The service worker precaches this file and serves it
       when a page is asked for with no network and no cached copy of its own —
       and the app sends a visitor here when a route's code was never cached.
       Static on purpose: no script (so nothing to pin in the CSP and nothing
       that can fail to load), no Angular, nothing fetched but one font and one
       icon, both precached beside it. -->
  <title>Offline — Eclipse Realms</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0a0f">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    @font-face {
      font-family: 'Orbitron';
      font-style: normal;
      font-weight: 400 900;
      font-display: swap;
      src: url('/assets/fonts/orbitron-latin-var.woff2') format('woff2');
    }
    :root {
      --page: #0a0a0f;
      --panel: #101017;
      --ink-0: #f4f2f8;
      --ink-1: #c9c4d6;
      --ink-2: #8f8aa1;
      --violet: #8b5cf6;
      --violet-bright: #a78bfa;
      --violet-glow: rgba(139, 92, 246, 0.34);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding:
        calc(env(safe-area-inset-top, 0px) + 24px)
        calc(env(safe-area-inset-right, 0px) + 16px)
        calc(env(safe-area-inset-bottom, 0px) + 24px)
        calc(env(safe-area-inset-left, 0px) + 16px);
      background:
        radial-gradient(ellipse 70% 50% at 50% 30%, var(--violet-glow), transparent 70%),
        var(--page);
      color: var(--ink-1);
      font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif;
      text-align: center;
      overscroll-behavior: none;
    }
    main { max-width: 420px; }
    .sigil {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      box-shadow: 0 0 40px -6px var(--violet);
    }
    h1 {
      margin: 20px 0 8px;
      font: 600 1.15rem/1.3 Orbitron, system-ui, sans-serif;
      letter-spacing: 0.06em;
      color: var(--ink-0);
    }
    p { margin: 0 0 8px; }
    .note { font-size: 0.85rem; color: var(--ink-2); }
    nav {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 24px;
    }
    a {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 20px;
      border-radius: 12px;
      font: 500 0.82rem/1 Orbitron, system-ui, sans-serif;
      letter-spacing: 0.05em;
      text-decoration: none;
      color: var(--ink-0);
      background: var(--panel);
      border: 1px solid var(--violet-glow);
    }
    a.primary {
      background: linear-gradient(120deg, var(--violet), #7b61ff);
      border-color: var(--violet-bright);
    }
    a:focus-visible { outline: 2px solid var(--violet-bright); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img class="sigil" src="/assets/brand/icon-192.png" width="96" height="96" alt="">
    <h1>The realm is out of reach</h1>
    <p>You are offline, and this part of Eclipse Realms has not been saved to this device yet.</p>
    <p class="note">Anything you have already played keeps working. Your progress is kept on this device and syncs the next time you are online.</p>
    <nav aria-label="Open">
      <a class="primary" href="/play">Enter the Seamworks</a>
      <a href="/sanctum">Open the Sanctum</a>
      <!-- An empty href is this document's own URL: when the worker served this
           page in place of /some/route, "Try again" asks for that route again. -->
      <a href="">Try again</a>
    </nav>
  </main>
</body>
</html>
